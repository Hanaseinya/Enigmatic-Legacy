name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check trigger flags
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      version: ${{ steps.flags.outputs.version }}
      mc_version: ${{ steps.flags.outputs.mc_version }}
      archive_name: ${{ steps.flags.outputs.archive_name }}
      gradle_args: ${{ steps.flags.outputs.gradle_args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version and commit message
        id: flags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | head -1 | cut -d'=' -f2- | tr -d '\r')"
          MC_VERSION="$(grep '^version_mc=' gradle.properties | head -1 | cut -d'=' -f2- | tr -d '\r')"
          ARCHIVE_NAME="$(grep '^mod_archives_name=' gradle.properties | head -1 | cut -d'=' -f2- | tr -d '\r')"
          TAG="v${VERSION}"

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG="$HEAD_COMMIT_MSG"
          BUILD=false
          RELEASE=false
          GRADLE_ARGS="--stacktrace"

          if echo "$MSG" | grep -qi "build-release"; then
            BUILD=true
            RELEASE=true
          elif echo "$MSG" | grep -qi "build-action"; then
            BUILD=true
          fi

          if echo "$MSG" | grep -q -- "--debug"; then
            GRADLE_ARGS="--stacktrace --info --debug"
          elif echo "$MSG" | grep -q -- "--info"; then
            GRADLE_ARGS="--stacktrace --info"
          fi

          echo "should_build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "gradle_args=$GRADLE_ARGS" >> "$GITHUB_OUTPUT"

      - name: Print parsed flags
        run: |
          echo "Version: ${{ steps.flags.outputs.version }}"
          echo "Minecraft: ${{ steps.flags.outputs.mc_version }}"
          echo "Archive: ${{ steps.flags.outputs.archive_name }}"
          echo "Build: ${{ steps.flags.outputs.should_build }}"
          echo "Release: ${{ steps.flags.outputs.should_release }}"
          echo "Gradle args: ${{ steps.flags.outputs.gradle_args }}"

  build:
    name: Build Forge mod JAR
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -PciBuildOnly=true --no-daemon ${{ needs.check.outputs.gradle_args }}

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          MC_VERSION="${{ needs.check.outputs.mc_version }}"
          ARCHIVE_NAME="${{ needs.check.outputs.archive_name }}"

          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)"

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found in build/libs"
            exit 1
          fi

          ASSET_NAME="${ARCHIVE_NAME}-${VERSION}-mc${MC_VERSION}-forge-hanasei-fork.jar"
          cp "$JAR_FILE" "$ASSET_NAME"

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "jar_file=$JAR_FILE" >> "$GITHUB_ENV"
          echo "Prepared artifact: $ASSET_NAME from $JAR_FILE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset_name }}
          path: ${{ env.asset_name }}

  release:
    name: Publish GitHub release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh

      - name: Generate release notes
        shell: bash
        run: |
          set -e
          VERSION="${{ needs.check.outputs.version }}"
          MC_VERSION="${{ needs.check.outputs.mc_version }}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1 || true)"

          {
            echo "# Enigmatic Legacy ${VERSION}"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Minecraft: \`${MC_VERSION}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            echo "## Changes"
          } > release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (`%h`) by @%an' --reverse \
              | grep -Evi '^- .*build-release.*$' >> release_notes.md || true
          else
            git log --pretty=format:'- %s (`%h`) by @%an' --reverse \
              | grep -Evi '^- .*build-release.*$' >> release_notes.md || true
          fi

          if [ "$(tail -n 1 release_notes.md | wc -c)" -le 1 ]; then
            echo "- No changelog entries." >> release_notes.md
          fi

          echo "Generated release notes:"
          cat release_notes.md

      - name: Resolve release asset
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          ARCHIVE_NAME="${{ needs.check.outputs.archive_name }}"
          JAR_FILE="$(find . -maxdepth 1 -type f -name "${ARCHIVE_NAME}-${VERSION}-mc*.jar" | head -1)"

          pwd
          ls -lh
          echo "Resolved version: $VERSION"
          echo "Resolved archive name: $ARCHIVE_NAME"
          echo "Resolved jar file: $JAR_FILE"

          if [ -z "$JAR_FILE" ]; then
            echo "Release asset not found"
            exit 1
          fi

          echo "jar_file=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Enigmatic Legacy ${{ needs.check.outputs.version }}
          body_path: release_notes.md
          files: ${{ env.jar_file }}
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
